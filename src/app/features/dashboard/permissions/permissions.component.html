<div class="flex flex-col h-full w-full overflow-x-auto no-scrollbar p-6 max-w-4xl mx-auto">
  <section class="flex flex-row items-baseline justify-between mb-4 w-full px-4">
    <mat-form-field appearance="outline" class="w-72">
      <mat-label>Buscar permiso</mat-label>
      <input matInput [formControl]="searchControl" placeholder="Nombre o descripción..." />
      <mat-icon matSuffix>search</mat-icon>
    </mat-form-field>
    <button type="button" matButton="filled" [disabled]="!(Permissions.ADD_PERMISSION | hasPermission)" (click)="openCreateTab()">
      <mat-icon>add</mat-icon> Nuevo permiso
    </button>
  </section>

  @if (isLoading()) {
    <mat-progress-bar mode="indeterminate" />
  }

  <table mat-table [dataSource]="dataSource" matSort>
    <ng-container matColumnDef="name">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Nombre</th>
      <td mat-cell *matCellDef="let permission">{{ permission.name }}</td>
    </ng-container>

    <ng-container matColumnDef="description">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Descripción</th>
      <td mat-cell *matCellDef="let permission">{{ permission.description || '—' }}</td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Acciones</th>
      <td mat-cell *matCellDef="let permission">
        <button type="button" matIconButton [disabled]="!(Permissions.DELETE_PERMISSION | hasPermission)" (click)="deletePermission(permission)">
          <mat-icon>delete</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr mat-row *matRowDef="let row; columns: displayedColumns"></tr>
    <tr *matNoDataRow>
      <td [attr.colspan]="displayedColumns.length">
        @if (!isLoading()) {
          <div class="py-20 flex flex-col items-center gap-2">
            <mat-icon class="!text-[56px] !w-14 !h-14 text-[color:var(--mat-sys-outline-variant)]">lock</mat-icon>
            <span class="text-base font-medium text-[color:var(--mat-sys-on-surface-variant)]">Sin permisos</span>
            <span class="text-sm text-[color:var(--mat-sys-outline)]">No hay permisos registrados</span>
          </div>
        }
      </td>
    </tr>
  </table>

  <mat-paginator [pageSizeOptions]="[5, 10, 20]" showFirstLastButtons />
</div>
