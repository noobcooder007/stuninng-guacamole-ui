<div class="flex flex-col h-full w-full overflow-x-auto no-scrollbar p-6">
  <section class="flex flex-row items-baseline justify-between mb-6 w-full px-4 gap-4">
    <!-- Búsqueda y Filtros -->
    <form class="flex flex-row gap-4 items-center flex-wrap" [formGroup]="searchForm">
      <!-- Campo de Búsqueda -->
      <mat-form-field class="flex-grow min-w-48" appearance="outline">
        <mat-label>Buscar (Nombre, ID, RFC)</mat-label>
        <input matInput formControlName="search" aria-label="search" />
      </mat-form-field>

      <!-- Toggle Status Filter -->
      <mat-button-toggle-group
        class="toggle-group"
        formControlName="status"
        aria-label="Status filter">
        <mat-button-toggle value="todos">Todos</mat-button-toggle>
        <mat-button-toggle value="activo">Activos</mat-button-toggle>
        <mat-button-toggle value="inactivo">Inactivos</mat-button-toggle>
      </mat-button-toggle-group>
    </form>

    <!-- Botón Agregar -->
    <button
      mat-raised-button
      color="primary"
      (click)="addColector()"
      class="whitespace-nowrap">
      <mat-icon>add</mat-icon>
      Agregar Colector
    </button>
  </section>

  <!-- Tabla -->
  <table
    mat-table
    [dataSource]="dataSource"
    matSort
    class="w-full mat-table-container">

    <!-- No. Colector Column -->
    <ng-container matColumnDef="noColector">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>No. Colector</th>
      <td mat-cell *matCellDef="let row">{{ row.noColector }}</td>
    </ng-container>

    <!-- Nombre Column -->
    <ng-container matColumnDef="nombre">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Nombre</th>
      <td mat-cell *matCellDef="let row">{{ row.nombre }}</td>
    </ng-container>

    <!-- Apellido Paterno Column -->
    <ng-container matColumnDef="apPaterno">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Ap. Paterno</th>
      <td mat-cell *matCellDef="let row">{{ row.apPaterno }}</td>
    </ng-container>

    <!-- Apellido Materno Column -->
    <ng-container matColumnDef="apMaterno">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Ap. Materno</th>
      <td mat-cell *matCellDef="let row">{{ row.apMaterno }}</td>
    </ng-container>

    <!-- RFC Column -->
    <ng-container matColumnDef="rfc">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>RFC</th>
      <td mat-cell *matCellDef="let row">{{ row.rfc }}</td>
    </ng-container>

    <!-- Activo Column -->
    <ng-container matColumnDef="activo">
      <th mat-header-cell *matHeaderCellDef mat-sort-header>Status</th>
      <td mat-cell *matCellDef="let row">
        <span [class.status-active]="row.activo" [class.status-inactive]="!row.activo">
          {{ row.activo ? 'Activo' : 'Inactivo' }}
        </span>
      </td>
    </ng-container>

    <!-- Actions Column -->
    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef>Acciones</th>
      <td mat-cell *matCellDef="let row">
        <button matIconButton (click)="editColector(row)" title="Editar">
          <mat-icon>edit</mat-icon>
        </button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="displayedColumns"></tr>
    <tr
      mat-row
      *matRowDef="let row; columns: displayedColumns;"
      (click)="viewColector(row)"
      class="clickable-row"></tr>
  </table>

  <!-- Paginator -->
  <mat-paginator
    [length]="pagination().itemCount"
    (page)="onPageChange($event)"
    [pageSize]="pagination().limit"
    [pageIndex]="pagination().page - 1"
    [pageSizeOptions]="[5, 10, 20]"
    showFirstLastButtons
    aria-label="Select page of colectores"
  ></mat-paginator>
</div>
