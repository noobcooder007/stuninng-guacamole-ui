<div class="recibos-especiales-container p-6">
  <mat-tab-group [(selectedIndex)]="activeTab">
    @for (section of sections; track section.id) {
      <mat-tab>
        <ng-template mat-tab-label>
          {{ section.label }}
        </ng-template>
        <div class="tab-content">
          <p>Contenido para: {{ section.label }}</p>
        </div>
      </mat-tab>
    }
  </mat-tab-group>
</div>
