<h2 mat-dialog-title>Búsqueda Avanzada de Colectores</h2>

<mat-dialog-content>
    <form class="grid grid-cols-3 gap-4 p-4" [formGroup]="instructionForm">
        <mat-form-field appearance="outline">
          <mat-label>Dia de la semana</mat-label>
          <mat-select formControlName="day">
            <mat-option value="Lunes">Lunes</mat-option>
            <mat-option value="Martes">Martes</mat-option>
            <mat-option value="Miercoles">Miercoles</mat-option>
            <mat-option value="Jueves">Jueves</mat-option>
            <mat-option value="Viernes">Viernes</mat-option>
            <mat-option value="Sabado">Sabado</mat-option>
            <mat-option value="Domingo">Domingo</mat-option>
          </mat-select>
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Hora</mat-label>
          <input type="time" matInput formControlName="hour" aria-label="hour" />
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Notas</mat-label>
          <input matInput formControlName="note" aria-label="note" />
        </mat-form-field>
    </form>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Cancelar</button>
  <button mat-button [mat-dialog-close]="instructionForm.value" [disabled]="!instructionForm.valid">Guardar</button>
</mat-dialog-actions>
