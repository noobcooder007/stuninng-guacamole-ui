<div class="container" [class.is-mobile]="isMobile()">
  <mat-toolbar class="toolbar" color="primary">
    <button matIconButton aria-label="menu" (click)="snav.toggle()">
      <mat-icon>menu</mat-icon>
    </button>
    <h1 class="app-name" routerLink="/">Sistema de Procuración de Fondos del Seminario Conciliar de México</h1>
    <div class="spacer"></div>
    <div class="profile">
      <div class="info">
        <span class="role">Administrador</span>
        <span class="username">jtejeda</span>
      </div>
      <img class="w-10" src="assets/images/profile-pic-male.svg" alt="profile-pic">
    </div>
  </mat-toolbar>
  <mat-sidenav-container class="sidenav-container" [style.marginTop.px]="isMobile() ? 56 : 0" hasBackdrop="true">
    <mat-sidenav #snav [mode]="isMobile() ? 'over' : 'side'" [fixedInViewport]="isMobile()" fixedTopGap="56">
      <mat-nav-list>
        <mat-list-item routerLink="/collectors" routerLinkActive>
          <span matListItemTitle>Colectores</span>
          <button matIconButton matListItemMeta>
            <mat-icon>groups</mat-icon>
          </button>
        </mat-list-item>
        <mat-list-item routerLink="/beneficients" routerLinkActive>
          <span matListItemTitle>Bienhechores</span>
          <button matIconButton matListItemMeta>
            <mat-icon>volunteer_activism</mat-icon>
          </button>
        </mat-list-item>
      </mat-nav-list>
    </mat-sidenav>
    <mat-sidenav-content>
      <router-outlet></router-outlet>
    </mat-sidenav-content>
  </mat-sidenav-container>
</div>
