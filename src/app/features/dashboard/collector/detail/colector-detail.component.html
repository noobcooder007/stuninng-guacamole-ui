<div class="detail-container dialog-container">

    <h1>Detalles del Colector</h1>

  <mat-tab-group class="tabs-container">
    <!-- PESTAÑA 1: DATOS PERSONALES -->
    <mat-tab label="Datos Personales">
      <ng-template mat-tab-label>
        <mat-icon class="tab-icon">person</mat-icon>
        Datos Personales
      </ng-template>
      <mat-card class="section-card">
        <mat-card-header>
          <mat-card-title>Información Personal</mat-card-title>
        </mat-card-header>
        <mat-card-content>
          <div class="form-grid">
            <div class="form-field">
              <label>Número Colector</label>
              <!-- <span>{{ colector.noColector }}</span> -->
            </div>
            <div class="form-field">
              <label>Nombre</label>
              <!-- <span>{{ colector.nombre }}</span> -->
            </div>
            <div class="form-field">
              <label>Apellido Paterno</label>
              <!-- <span>{{ colector.apPaterno }}</span> -->
            </div>
            <div class="form-field">
              <label>Apellido Materno</label>
              <!-- <span>{{ colector.apMaterno }}</span> -->
            </div>
            <div class="form-field">
              <label>RFC</label>
              <!-- <span>{{ colector.rfc }}</span> -->
            </div>
            <div class="form-field">
              <label>Número Seguro Social</label>
              <!-- <span>{{ colector.numeroSeguroSocial }}</span> -->
            </div>
            <div class="form-field">
              <label>Activo</label>
              <!-- <span [class.active]="colector.activo">{{ colector.activo ? 'Sí' : 'No' }}</span> -->
            </div>
          </div>
        </mat-card-content>
      </mat-card>
    </mat-tab>

    <!-- PESTAÑA 2: CONTACTO -->
    <mat-tab label="Contacto">
      <ng-template mat-tab-label>
        <mat-icon class="tab-icon">contacts</mat-icon>
        Contacto
      </ng-template>
      <mat-card class="section-card">
        <mat-card-header>
          <mat-card-title>Información de Contacto</mat-card-title>
        </mat-card-header>
        <mat-card-content>
          <div class="form-grid">
            <div class="form-field">
              <label>Teléfono</label>
              <!-- <span>{{ colector.telefono }}</span> -->
            </div>
            <div class="form-field">
              <label>Celular</label>
              <!-- <span>{{ colector.celular }}</span> -->
            </div>
            <div class="form-field">
              <label>Email</label>
              <!-- <span>{{ colector.email }}</span> -->
            </div>
            <div class="form-field full-width">
              <label>Contacto Emergente</label>
              <!-- <span>{{ colector.contactoEmergente }}</span> -->
            </div>
          </div>
        </mat-card-content>
      </mat-card>
    </mat-tab>

    <!-- PESTAÑA 3: DIRECCIÓN -->
    <mat-tab label="Dirección">
      <ng-template mat-tab-label>
        <mat-icon class="tab-icon">location_on</mat-icon>
        Dirección
      </ng-template>
      <mat-card class="section-card">
        <mat-card-header>
          <mat-card-title>Información de Domicilio</mat-card-title>
        </mat-card-header>
        <mat-card-content>
          <div class="form-grid">
            <div class="form-field">
              <label>Calle</label>
              <!-- <span>{{ colector.calle }}</span> -->
            </div>
            <div class="form-field">
              <label>Colonia</label>
              <!-- <span>{{ colector.colonia }}</span> -->
            </div>
            <div class="form-field">
              <label>Delegación/Municipio</label>
              <!-- <span>{{ colector.delegacionMunicipio }}</span> -->
            </div>
            <div class="form-field">
              <label>Población/Ciudad</label>
              <!-- <span>{{ colector.poblacionCiudad }}</span> -->
            </div>
            <div class="form-field">
              <label>Código Postal</label>
              <!-- <span>{{ colector.codigoPostal }}</span> -->
            </div>
            <div class="form-field">
              <label>Entidad Federativa</label>
              <!-- <span>{{ colector.entidadFederativa }}</span> -->
            </div>
          </div>
        </mat-card-content>
      </mat-card>
    </mat-tab>

    <!-- PESTAÑA 4: PROPIEDADES FINANCIERAS -->
    <mat-tab label="Propiedades Financieras">
      <ng-template mat-tab-label>
        <mat-icon class="tab-icon">attach_money</mat-icon>
        Propiedades Financieras
      </ng-template>
      <mat-card class="section-card">
        <mat-card-header>
          <mat-card-title>Información Financiera</mat-card-title>
        </mat-card-header>
        <mat-card-content>
          <div class="form-grid">
            <div class="form-field">
              <label>Porcentaje Comisión (%)</label>
              <!-- <span>{{ colector.porcentajeComision }}</span> -->
            </div>
            <div class="form-field">
              <label>Referencia Bancaria</label>
              <!-- <span>{{ colector.referenciaBancaria }}</span> -->
            </div>
            <div class="form-field">
              <label>Referencia</label>
              <!-- <span>{{ colector.referencia }}</span> -->
            </div>
            <div class="form-field full-width">
              <label>Observaciones</label>
              <!-- <span>{{ colector.observaciones }}</span> -->
            </div>
          </div>
        </mat-card-content>
      </mat-card>
    </mat-tab>
  </mat-tab-group>
</div>
