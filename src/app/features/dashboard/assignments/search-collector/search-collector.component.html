<h2 mat-dialog-title>Búsqueda Avanzada de Colectores</h2>

<mat-dialog-content>
    <form class="grid grid-cols-3 gap-4 p-4" [formGroup]="searchForm">
        <mat-form-field appearance="outline">
          <mat-label>Nombre</mat-label>
          <input matInput formControlName="firstname" aria-label="firstname" />
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Apellido paterno</mat-label>
          <input matInput formControlName="firstLastname" aria-label="firstLastname" />
        </mat-form-field>
        <mat-form-field appearance="outline">
          <mat-label>Apellido materno</mat-label>
          <input matInput formControlName="secondLastname" aria-label="secondLastname" />
        </mat-form-field>
    </form>

  <table mat-table [dataSource]="dataSource">
    <ng-container matColumnDef="fullname">
      <th mat-header-cell *matHeaderCellDef>Nombre Completo</th>
      <td mat-cell *matCellDef="let collector">{{ collector | fullname }}</td>
    </ng-container>

    <ng-container matColumnDef="actions">
      <th mat-header-cell *matHeaderCellDef></th>
      <td mat-cell *matCellDef="let c">
        <button mat-stroked-button (click)="onSelect(c)">Seleccionar</button>
      </td>
    </ng-container>

    <tr mat-header-row *matHeaderRowDef="['fullname', 'actions']"></tr>
    <tr mat-row *matRowDef="let row; columns: ['fullname', 'actions']"></tr>
  </table>

  <mat-paginator
    [length]="pagination().itemCount"
    [pageSize]="pagination().limit"
    [pageIndex]="pagination().page - 1"
    [pageSizeOptions]="[5, 10, 20]"
    (page)="onPageChange($event)"
    showFirstLastButtons
  >
  </mat-paginator>
</mat-dialog-content>

<mat-dialog-actions align="end">
  <button mat-button mat-dialog-close>Cancelar</button>
</mat-dialog-actions>
