<div class="login-container">
  <mat-card appearance="outlined" class="login-card">
    <mat-card-header class="login-header">
      <mat-card-title>Bienvenido</mat-card-title>
      <mat-card-subtitle>Es bueno verte de nuevo</mat-card-subtitle>
    </mat-card-header>
    <mat-card-content>
      <form (ngSubmit)="onSubmit($event)" [formGroup]="loginForm" class="login-form">
        <mat-form-field appearance="outline">
          <mat-label>Nombre de usuario</mat-label>
          <input
            matInput
            type="text"
            required
            placeholder="Ingresa tu nombre de usuario"
            formControlName="username"
          />
          <mat-error>Por favor, ingresa un nombre de usuario válido.</mat-error>
        </mat-form-field>

        <mat-form-field appearance="outline">
          <mat-label>Contraseña</mat-label>
          <input
            matInput
            [type]="hide() ? 'password' : 'text'"
            required
            placeholder="Ingresa tu contraseña"
            formControlName="password"
            (keydown.enter)="loginForm.valid && !isLoading() && onSubmit($event)"
          />
          <button
            type="button"
            matIconButton
            matSuffix
            (click)="showPassword($event)"
            [attr.aria-label]="'Hide password'"
            [attr.aria-pressed]="hide()"
          >
            <mat-icon>{{ hide() ? 'visibility_off' : 'visibility' }}</mat-icon>
          </button>
          <mat-error>Por favor, ingresa una contraseña.</mat-error>
        </mat-form-field>
        <mat-checkbox formControlName="rememberMe">Recordarme</mat-checkbox>
        <button mat-flat-button type="submit" [disabled]="!loginForm.valid || isLoading()">
          @if (!isLoading()) {
          <ng-container> Iniciar sesión </ng-container>
          } @else {
          <mat-spinner diameter="20"></mat-spinner>
          }
        </button>
      </form>
    </mat-card-content>
    <mat-card-actions> </mat-card-actions>
  </mat-card>
</div>
